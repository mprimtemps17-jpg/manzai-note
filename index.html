<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f5">
    <meta name="apple-mobile-web-app-title" content="漫才ノート">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/app.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <title>漫才ノート</title>
    <style>
      html{background:#f4f7f5}body{margin:0}.boot{max-width:940px;margin:auto;padding:48px 24px;min-height:calc(100dvh - 96px)}.boot i{display:block;border-radius:22px;background:#e6ede9;animation:boot 1.1s ease-in-out infinite alternate}.boot i:nth-child(1){height:34px;width:142px;margin-bottom:30px}.boot i:nth-child(2){height:215px;margin-bottom:44px}.boot i:nth-child(3){height:25px;width:126px;margin-bottom:18px}.boot i:nth-child(n+4){height:84px;margin-bottom:12px}@keyframes boot{to{opacity:.52}}@media(prefers-reduced-motion:reduce){.boot i{animation:none}}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="読み込み中"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <noscript>漫才ノートを開くにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
